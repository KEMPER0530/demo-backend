version: 2.1
orbs:
  aws-cli: circleci/aws-cli@3.1.4
  go: circleci/go@1.7.0
workflows:
  version: 2
  test_and_build_and_deploy:
    jobs:
      - test
      - build-and-push-lambda-image:
          requires:
            - test
          filters:
            branches:
              only: main
      - aws-lambda-deploy:
          requires:
            - build-and-push-lambda-image
          filters:
            branches:
              only: main
executors:
  ecr_machine:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
jobs:
  test:
    docker:
      - image: golang:1.26.1
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run:
          name: Show Go version
          command: go version
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
            - /root/.cache/go-build
      - run:
          name: Run unit tests
          command: go test ./src/... -covermode=atomic -race
  build-and-push-lambda-image:
    executor: ecr_machine
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Log into Amazon ECR
          command: |
            aws ecr get-login-password --region ${AWS_REGION} --profile default | docker login --username AWS --password-stdin ${AWS_ECR_ACCOUNT_URL}
      - run:
          name: Ensure ECR repository exists
          command: |
            aws ecr describe-repositories --profile default --region ${AWS_REGION} --repository-names ${AWS_RESOURCE_NAME_PREFIX} > /dev/null 2>&1 || \
            aws ecr create-repository --profile default --region ${AWS_REGION} --repository-name ${AWS_RESOURCE_NAME_PREFIX} --image-scanning-configuration scanOnPush=true
      - run:
          name: Build and push Lambda image
          command: |
            IMAGE_TAG="${AWS_ECR_IMAGE_TAG:-latest}"
            IMAGE_URI="${AWS_ECR_ACCOUNT_URL}/${AWS_RESOURCE_NAME_PREFIX}:${IMAGE_TAG}"
            docker buildx create --use --name lambda-builder || docker buildx use lambda-builder
            docker buildx build --platform linux/arm64 --provenance=false -t "${IMAGE_URI}" --push .
  aws-lambda-deploy:
    executor: aws-cli/default
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Deploy Lambda
          command: |
            IMAGE_TAG="${AWS_ECR_IMAGE_TAG:-latest}"
            DIGEST=$(aws ecr describe-images --region ${AWS_REGION} --repository-name ${AWS_RESOURCE_NAME_PREFIX} --image-ids imageTag="${IMAGE_TAG}" --query "imageDetails[0].imageDigest" --output text)
            IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${AWS_RESOURCE_NAME_PREFIX}@${DIGEST}"
            if ! aws lambda get-function --region ${AWS_REGION} --function-name ${LAMBDA_FUNCTION} > /dev/null 2>&1; then
              aws lambda create-function \
               --function-name ${LAMBDA_FUNCTION} \
               --architectures arm64 \
               --package-type Image \
               --code ImageUri=${IMAGE_URI} \
               --region ${AWS_REGION} \
               --environment "Variables={GO_ENV="production", PORT=${PORT}, AWS_SES_ACCESS_KEY_ID=${AWS_SES_ACCESS_KEY_ID}, AWS_SES_ENDPOINT=${AWS_SES_ENDPOINT}, AWS_SES_REGION=${AWS_SES_REGION},AWS_SES_SECRET_KEY=${AWS_SES_SECRET_KEY}}" \
               --role ${AWS_LAMBDA_ROLE}
            else
              aws lambda update-function-code \
               --function-name ${LAMBDA_FUNCTION} \
               --architectures arm64 \
               --image-uri ${IMAGE_URI} \
               --region ${AWS_REGION}
            fi
cache:
  paths:
    - vendor/
    - go/pkg/
